<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleacademy - Registro de Estudiante</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1 class="logo">🎓 Teleacademy</h1>
            <p class="subtitle">Registro de Estudiante</p>

            <form id="registroForm">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Juan Pérez López" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="passwordConfirm" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label>Teléfono (Opcional)</label>
                    <input type="tel" id="telefono" placeholder="+51 999 999 999">
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>

                <p class="footer-text">¿Ya tienes cuenta? <a href="../index.html">Inicia sesión aquí</a></p>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
